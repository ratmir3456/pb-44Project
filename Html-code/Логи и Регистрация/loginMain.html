<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>IchiKado — вход</title>
     <link rel="stylesheet" href="../Css/style.css">
    </head>
  <body>
      <main class="page">
      <section class="art">
        <p class="logo">IchiKado</p>
        <img src="../Фотки/i.webp" alt="Японский сад с пагодой">
      </section>

      <section class="login">
        <button class="language" type="button">＋ Eng ▾</button>
        <div class="brand">IchiKado</div>
        <div class="lantern" aria-hidden="true">🏮</div>
        <h1>Welcome to IchiKado</h1>

        <form>
          <input type="email" placeholder="Email" required>
          <input type="password" placeholder="Password" required>
          <a class="forgot" href="#">Forgot password?</a>

          <div class="divider">or</div>
          <button class="google" type="button">Login with Google</button>
          <button class="submit" type="submit">Login</button>

          <div class="signup">
            Don’t have an account? <a href="#">Sign up</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
